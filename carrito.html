
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito | Perfumería Essencial</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="cabecera">
    <a href="index.html" class="marca">
        <img src="img/Logo.png" alt="Logo Essencial" class="logo">
    </a>
    <nav class="menu" aria-label="Menú principal">
         <a href="index.html">Inicio</a>
    <a href="index.html#categorias">Catálogo</a>
    <a href="femeninos.html">Femeninos</a>
    <a href="masculinos.html">Masculinos</a>
    <a href="unisex.html">Unisex</a>
    <a href="packs.html">Sets</a>
      
    </nav>
</header>

<main class="container py-5" id="contenidoCarrito" hidden>
    <h1>Mi carrito</h1>
    <p>Revisa los productos de tu compra simulada.</p>

    <div class="row g-4">
        <div class="col-12 col-lg-8">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCarrito"></tbody>
                </table>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <section class="card p-4">
                <h2 class="h4">Resumen de compra</h2>

                <label for="sucursalCompra" class="form-label">
                    Sucursal para retiro
                </label>
                <select id="sucursalCompra" class="form-select mb-3">
                    <option value="chillan">Chillán</option>
                    <option value="concepcion">Concepción</option>
                    <option value="santiago">Santiago</option>
                </select>

                <p class="fs-4 fw-bold">
                    Total: <span id="totalCarrito">$0</span>
                </p>

                <button id="confirmarCompra"
                        class="btn btn-danger">
                    Simular pago
                </button>
            </section>
        </div>
    </div>

    <div id="mensajeCompra" class="mt-4"
         role="status" aria-live="polite"></div>
</main>

<footer class="pie-pagina">
    <p>Perfumería Essencial</p>
</footer>

<script src="js/datos.js"></script>
<script src="js/auth.js"></script>
<script src="js/carrito.js"></script>
</body>
</html>

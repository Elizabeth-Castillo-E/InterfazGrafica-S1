
<!DOCTYPE html>
<html lang="es">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="cabecera">
    <a class="marca" href="index.html">
        <img src="img/logo.png" alt="Logo Essencial" class="logo">
    </a>
    <nav class="menu" aria-label="Menú principal">
         <a href="index.html">Inicio</a>
    <a href="index.html#categorias">Catálogo</a>
    <a href="femeninos.html">Femeninos</a>
    <a href="masculinos.html">Masculinos</a>

        <a href="login.html">Iniciar sesión</a>
    </nav>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <h1 class="mb-4">Recuperar contraseña</h1>
            <p>Ingresa tu correo electrónico.</p>

            <form id="formRecuperar" novalidate>
                <div class="mb-3">
                    <label for="emailRecuperacion" class="form-label">
                        Correo electrónico
                    </label>
                    <input type="email" class="form-control"
                           id="emailRecuperacion"
                           autocomplete="email" required>
                    <div class="invalid-feedback">
                        Ingresa un correo electrónico válido.
                    </div>
                </div>
                <button type="submit" class="btn btn-danger">
                    Solicitar recuperación
                </button>
            </form>

            <div id="mensajeRecuperar" role="status"
                 aria-live="polite" class="mt-3"></div>
        </div>
    </div>
</main>

<footer class="pie-pagina">
    <p>Perfumería Essencial</p>
</footer>

<script src="js/auth.js"></script>
<script src="js/recuperar.js"></script>
</body>
</html>

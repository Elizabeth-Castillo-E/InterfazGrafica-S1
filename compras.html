<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis compras | Perfumería Essencial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="cabecera">
        <a href="index.html" class="marca">
            <img src="img/Logo.png" alt="Logo Essencial" class="logo">
        </a>
        <nav class="menu" aria-label="Menú principal">
            <a href="index.html">Inicio</a>
            <a href="index.html#categorias">Catálogo</a>
            <a href="femeninos.html">Femeninos</a>
            <a href="masculinos.html">Masculinos</a>
            <a href="unisex.html">Unisex</a>
            <a href="packs.html">Sets</a>
        </nav>
    </header>

    <main class="container py-5" id="contenidoCompras" hidden>
        <h1>Mis compras</h1>
        <p>Revisa los pedidos de tu cuenta y la sucursal de retiro.</p>

        <p id="sinCompras" hidden>Todavía no tienes compras realizadas.</p>
        <div class="table-responsive" id="historialCompras" hidden>
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th scope="col">Pedido</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Sucursal</th>
                        <th scope="col">Productos</th>
                        <th scope="col">Total</th>
                    </tr>
                </thead>
                <tbody id="tablaCompras"></tbody>
            </table>
        </div>
        <a class="btn btn-outline-danger" href="carrito.html">Ir a mi carrito</a>
    </main>

    <footer class="pie-pagina">
        <p>Perfumería Essencial</p>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/compras.js"></script>
</body>
</html>
